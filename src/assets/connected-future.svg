<svg
    width="600"
    height="650"
    viewBox="0 0 600 650"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
        >
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4CAF50" />
        </marker>
    </defs>

    <!-- SMART CITY -->
    <rect
        x="200"
        y="30"
        width="200"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="300"
        y="67"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        SMART CITY
    </text>

    <!-- Branch -->
    <path
        d="M300 90 V125 H180 V165"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <path
        d="M300 125 H420 V165"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <!-- AI -->
    <rect
        x="100"
        y="165"
        width="160"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="180"
        y="202"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        AI
    </text>

    <!-- IoT -->
    <rect
        x="340"
        y="165"
        width="160"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="420"
        y="202"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        IoT
    </text>

    <!-- Join -->
    <path
        d="M180 225 V270 H300 V310"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <path
        d="M420 225 V270 H300 V310"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <!-- SMART AGRICULTURE -->
    <rect
        x="150"
        y="310"
        width="300"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="300"
        y="347"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        SMART AGRICULTURE
    </text>

    <!-- Sustainability -->
    <path
        d="M300 370 V420"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <rect
        x="150"
        y="420"
        width="300"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="300"
        y="457"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        SUSTAINABILITY
    </text>

    <!-- Future -->
    <path
        d="M300 480 V530"
        stroke="#4CAF50"
        stroke-width="2"
        marker-end="url(#arrow)"
    />

    <rect
        x="200"
        y="530"
        width="200"
        height="60"
        rx="12"
        fill="#10251A"
        stroke="#4CAF50"
        stroke-width="2"
    />
    <text
        x="300"
        y="567"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
    >
        FUTURE
    </text>
</svg>